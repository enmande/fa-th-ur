name: Release

# How to release:
#   1. On a branch, run: npm run version:bump -- <patch|minor|major>
#      The script sets the next version in package.json, package-lock.json, and manifest.json.
#   2. Open a PR to main with the bump. Merge it.
#   3. In the Actions tab, run "Release" on main. Only a repository admin can run it.
#
# Notes:
#   - Commits merged after the bump are in the release.
#   - A bump that is not released is skipped. The next release uses the newest bump.
#   - Do not use "Draft a new release" on the Releases page. It makes a tag with no build and no zips.
#   - Actions are pinned to commit SHAs. The comment after each SHA names its release.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "::error::$GITHUB_ACTOR has $permission permission. Only a repository admin can release."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          package="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package" ]; then
            echo "::error::manifest.json has $version, package.json has $package."
            exit 1
          fi
          tag="v$version"
          if result="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1)"; then
            echo "::error::tag $tag already exists. Bump the version in a PR first."
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$result"; then
            echo "::error::could not check tag $tag: $result"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Package
        run: scripts/package.sh "$TAG" release
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
          path: release

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if result="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1)"; then
            echo "::error::tag $TAG already exists. Bump the version in a PR first."
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$result"; then
            echo "::error::could not check tag $TAG: $result"
            exit 1
          fi
          gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --generate-notes --title "fa-th-ur $TAG"
